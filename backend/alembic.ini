# Alembic configuration for FarmTwin Backend
# Requirements: 2.1, 2.2

[alembic]
# Path to migration scripts
script_location = app/db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug to max length
truncate_slug_length = 40

# Timezone for revision timestamps
timezone = UTC

# Version path separator - use os path separator
# version_path_separator = os
# version_path_separator = :
# version_path_separator = space
version_path_separator = os

# Set to 'true' to run with a python debugger
# (Note: This setting is not respected when running via the API - migrations
#  must be run through management commands only)
# sqlalchemy.echo = false

# Output encoding for revision script generation
output_encoding = utf-8

# Database URL - REPLACED AT RUNTIME from environment/settings
# Do not hardcode credentials here
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Post-write hooks - not used in Phase 1
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
