[project]
name = "farmtwin-backend"
version = "1.0.0"
description = "FarmTwin Phase 1 Backend Foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "geoalchemy2==0.15.2",
    "pyproj==3.6.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "uvicorn[standard]==0.31.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.115.2",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_metadata"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hypothesis]
max_examples = 100
deadline = 5000
