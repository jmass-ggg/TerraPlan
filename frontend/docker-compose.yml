services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FARMTWIN_API_URL: ${NEXT_PUBLIC_FARMTWIN_API_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    restart: unless-stopped
